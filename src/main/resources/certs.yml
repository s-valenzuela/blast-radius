certificates:
  - id: edge-tls
    name: "Edge TLS *.example.com"
    issuer: "Let's Encrypt"
    expiresOn: 2026-06-12
  - id: internal-ca
    name: "Internal Root CA"
    issuer: "Corp PKI"
    expiresOn: 2027-01-30
  - id: payments-mtls
    name: "Payments mTLS"
    issuer: "Corp PKI"
    expiresOn: 2026-05-30
  - id: kafka-broker
    name: "Kafka Broker TLS"
    issuer: "Corp PKI"
    expiresOn: 2026-08-01
  - id: vendor-api
    name: "Vendor API Client Cert"
    issuer: "Vendor CA"
    expiresOn: 2026-05-22

services:
  - id: gateway
    name: "API Gateway"
    team: platform
    certs: [edge-tls, internal-ca]
    dependsOn: []
  - id: auth
    name: "Auth Service"
    team: identity
    certs: [internal-ca]
    dependsOn: []
  - id: orders
    name: "Orders Service"
    team: commerce
    certs: [internal-ca]
    dependsOn: [auth, payments, inventory]
  - id: payments
    name: "Payments Service"
    team: commerce
    certs: [internal-ca, payments-mtls, vendor-api]
    dependsOn: [auth]
  - id: inventory
    name: "Inventory Service"
    team: commerce
    certs: [internal-ca]
    dependsOn: [events]
  - id: events
    name: "Event Bus"
    team: platform
    certs: [kafka-broker, internal-ca]
    dependsOn: []
  - id: notifications
    name: "Notifications"
    team: growth
    certs: [internal-ca]
    dependsOn: [events, auth]
  - id: web
    name: "Web Frontend"
    team: web
    certs: []
    dependsOn: [gateway, orders, auth]
